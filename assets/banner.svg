<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Naseem Tahir - AI Engineer at Arcana Info</title>
  <desc id="d">Animated diagram: RAG chatbots, voice agents and OCR assistants feed an LLM core that powers content pipelines, a PR review bot and FastAPI services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#151B2E"/>
    </linearGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .node { fill: #111827; stroke: #334155; stroke-width: 1.5; }
      .link { fill: none; stroke: #334155; stroke-width: 2; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      @keyframes pulse { 0%, 30% { opacity: .2; } 40%, 58% { opacity: 1; } 72%, 100% { opacity: .2; } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="258.5" rx="17.5" fill="none" stroke="#273449" stroke-width="1.5"/>

  <!-- Left: identity -->
  <text x="60" y="72" class="mono" font-size="14" letter-spacing="2" fill="#FBBF24">AI ENGINEER  ·  ARCANA INFO</text>
  <text x="58" y="142" class="sans" font-size="62" font-weight="700" fill="url(#name)">Naseem Tahir</text>
  <text x="60" y="182" class="sans" font-size="22" fill="#CBD5E1">LLM applications, agents and automation</text>
  <text x="60" y="218" class="mono" font-size="14" fill="#94A3B8">Python · FastAPI · LangChain · LangGraph</text>

  <!-- Right: hub diagram -->
  <rect x="600" y="34" width="590" height="192" rx="16" fill="#0F172A" fill-opacity="0.55" stroke="#273449" stroke-width="1.5"/>
  <text x="616" y="56" class="mono" font-size="12" fill="#FB7185" fill-opacity="0.9">what I ship</text>

  <path class="link" d="M740,84 C800,84 800,134 851,134"/>
  <path class="link" d="M740,134 L851,134"/>
  <path class="link" d="M740,184 C800,184 800,134 851,134"/>
  <path class="link" d="M939,134 C990,134 990,84 1050,84"/>
  <path class="link" d="M939,134 L1050,134"/>
  <path class="link" d="M939,134 C990,134 990,184 1050,184"/>

  <rect class="node" x="620" y="66" width="120" height="36" rx="10" stroke="#FBBF24" stroke-opacity="0.8"/>
  <text x="680" y="89" class="mono" font-size="13" fill="#E2E8F0" text-anchor="middle">RAG chatbots</text>
  <rect class="node" x="620" y="116" width="120" height="36" rx="10" stroke="#FBBF24" stroke-opacity="0.8"/>
  <text x="680" y="139" class="mono" font-size="13" fill="#E2E8F0" text-anchor="middle">Voice agents</text>
  <rect class="node" x="620" y="166" width="120" height="36" rx="10" stroke="#FBBF24" stroke-opacity="0.8"/>
  <text x="680" y="189" class="mono" font-size="13" fill="#E2E8F0" text-anchor="middle">OCR assistants</text>

  <rect class="node" x="1050" y="66" width="120" height="36" rx="10" stroke="#FB7185" stroke-opacity="0.9"/>
  <text x="1110" y="89" class="mono" font-size="12" fill="#E2E8F0" text-anchor="middle">Content pipelines</text>
  <rect class="node" x="1050" y="116" width="120" height="36" rx="10" stroke="#FB7185" stroke-opacity="0.9"/>
  <text x="1110" y="139" class="mono" font-size="13" fill="#E2E8F0" text-anchor="middle">PR review bot</text>
  <rect class="node" x="1050" y="166" width="120" height="36" rx="10" stroke="#FB7185" stroke-opacity="0.9"/>
  <text x="1110" y="189" class="mono" font-size="13" fill="#E2E8F0" text-anchor="middle">FastAPI services</text>

  <circle class="pulse" cx="895" cy="134" r="52" fill="none" stroke="#FB7185" stroke-width="3"/>
  <circle cx="895" cy="134" r="44" fill="#111827" stroke="#FB7185" stroke-width="1.5"/>
  <text x="895" y="132" class="sans" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">LLM</text>
  <text x="895" y="150" class="mono" font-size="11" fill="#94A3B8" text-anchor="middle">core</text>

  <!-- inputs travel into the core -->
  <circle r="4.5" fill="#FBBF24" opacity="0">
    <animateMotion dur="4s" repeatCount="indefinite" path="M740,84 C800,84 800,134 851,134" keyPoints="0;1;1" keyTimes="0;0.35;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.02;0.33;0.35;1"/>
  </circle>
  <circle r="4.5" fill="#FBBF24" opacity="0">
    <animateMotion dur="4s" repeatCount="indefinite" path="M740,134 L851,134" keyPoints="0;1;1" keyTimes="0;0.35;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.02;0.33;0.35;1"/>
  </circle>
  <circle r="4.5" fill="#FBBF24" opacity="0">
    <animateMotion dur="4s" repeatCount="indefinite" path="M740,184 C800,184 800,134 851,134" keyPoints="0;1;1" keyTimes="0;0.35;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.02;0.33;0.35;1"/>
  </circle>

  <!-- results travel out of the core -->
  <circle r="4.5" fill="#FB7185" opacity="0">
    <animateMotion dur="4s" repeatCount="indefinite" path="M939,134 C990,134 990,84 1050,84" keyPoints="0;0;1;1" keyTimes="0;0.5;0.85;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.83;0.85;1"/>
  </circle>
  <circle r="4.5" fill="#FB7185" opacity="0">
    <animateMotion dur="4s" repeatCount="indefinite" path="M939,134 L1050,134" keyPoints="0;0;1;1" keyTimes="0;0.5;0.85;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.83;0.85;1"/>
  </circle>
  <circle r="4.5" fill="#FB7185" opacity="0">
    <animateMotion dur="4s" repeatCount="indefinite" path="M939,134 C990,134 990,184 1050,184" keyPoints="0;0;1;1" keyTimes="0;0.5;0.85;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.83;0.85;1"/>
  </circle>
</svg>
