<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Naseem Tahir - AI Engineer</title>
  <desc id="d">Animated hybrid retrieval pipeline: a query is searched by vector and BM25 retrievers, merged with Reciprocal Rank Fusion, and returns an answer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#151B2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#FB7185" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .node { fill: #111827; stroke: #334155; stroke-width: 1.5; }
      .link { fill: none; stroke: #334155; stroke-width: 2; }
      .pulse { animation: pulse 3.6s ease-in-out infinite; }
      @keyframes pulse { 0%, 60% { opacity: .2; } 72%, 90% { opacity: 1; } 100% { opacity: .2; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .pulse, .cursor { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="17.5" fill="none" stroke="#273449" stroke-width="1.5"/>

  <!-- Left: identity -->
  <text x="60" y="92" class="mono" font-size="15" fill="#FBBF24">$ rag.query('who ships production LLM apps?')<tspan class="cursor">_</tspan></text>
  <text x="58" y="172" class="sans" font-size="66" font-weight="700" fill="url(#name)">Naseem Tahir</text>
  <text x="60" y="216" class="sans" font-size="21" fill="#CBD5E1">AI Engineer · LLMs · RAG Systems · Applied ML</text>
  <text x="60" y="262" class="mono" font-size="15" fill="#94A3B8">hybrid retrieval  ·  guardrails  ·  FastAPI</text>

  <!-- Right: pipeline -->
  <rect x="600" y="58" width="590" height="226" rx="16" fill="none" stroke="#FB7185" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="616" y="80" class="mono" font-size="12" fill="#FB7185" fill-opacity="0.9">guardrails: RBAC · PII redaction · prompt-injection defense</text>

  <path class="link" d="M710,172 C740,172 740,112 770,112"/>
  <path class="link" d="M710,172 C740,172 740,232 770,232"/>
  <path class="link" d="M920,112 C950,112 950,172 970,172"/>
  <path class="link" d="M920,232 C950,232 950,172 970,172"/>
  <path class="link" d="M1040,172 L1080,172"/>

  <rect class="node" x="620" y="150" width="90" height="44" rx="10"/>
  <text x="665" y="177" class="mono" font-size="14" fill="#E2E8F0" text-anchor="middle">query</text>

  <rect class="node" x="770" y="90" width="150" height="44" rx="10" stroke="#FBBF24" stroke-opacity="0.8"/>
  <text x="845" y="117" class="mono" font-size="13" fill="#E2E8F0" text-anchor="middle">vector · pgvector</text>

  <rect class="node" x="770" y="210" width="150" height="44" rx="10" stroke="#FBBF24" stroke-opacity="0.8"/>
  <text x="845" y="237" class="mono" font-size="13" fill="#E2E8F0" text-anchor="middle">BM25 · full-text</text>

  <rect class="node" x="970" y="150" width="70" height="44" rx="10" stroke="#FB7185" stroke-opacity="0.9"/>
  <text x="1005" y="177" class="mono" font-size="14" fill="#E2E8F0" text-anchor="middle">RRF</text>

  <rect class="pulse" x="1074" y="144" width="102" height="56" rx="14" fill="none" stroke="#FB7185" stroke-width="3"/>
  <rect class="node" x="1080" y="150" width="90" height="44" rx="10" stroke="#FB7185"/>
  <text x="1125" y="177" class="mono" font-size="14" fill="#E2E8F0" text-anchor="middle">answer</text>

  <!-- Travelling dots: query -> retrievers -->
  <circle r="4.5" fill="#FBBF24" opacity="0">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M710,172 C740,172 740,112 770,112" keyPoints="0;1;1" keyTimes="0;0.25;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1"/>
  </circle>
  <circle r="4.5" fill="#FBBF24" opacity="0">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M710,172 C740,172 740,232 770,232" keyPoints="0;1;1" keyTimes="0;0.25;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1"/>
  </circle>

  <!-- retrievers -> fusion -->
  <circle r="4.5" fill="#FBBF24" opacity="0">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M920,112 C950,112 950,172 970,172" keyPoints="0;0;1;1" keyTimes="0;0.25;0.5;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1"/>
  </circle>
  <circle r="4.5" fill="#FBBF24" opacity="0">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M920,232 C950,232 950,172 970,172" keyPoints="0;0;1;1" keyTimes="0;0.25;0.5;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1"/>
  </circle>

  <!-- fusion -> answer -->
  <circle r="5" fill="#FB7185" opacity="0">
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M1040,172 L1080,172" keyPoints="0;0;1;1" keyTimes="0;0.5;0.65;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.63;0.65;1"/>
  </circle>
</svg>
